<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pothole Detector</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1e2328;
    --text: #eef1f3;
    --muted: #8d98a1;
    --accent: #ffb703;
    --danger: #e63946;
    --ok: #4cc38a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transition: background 0.2s;
  }
  body.alert { background: #4a1219; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  .buttons { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #1a1400;
    cursor: pointer;
  }
  button.secondary { background: var(--panel); color: var(--text); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #status {
    min-height: 40px;
    font-size: 26px;
    font-weight: 800;
    color: var(--danger);
    text-align: center;
    margin: 6px 0;
  }
  #message { color: var(--muted); font-size: 14px; text-align: center; min-height: 20px; }
  #webcam { display: flex; justify-content: center; margin: 10px 0; }
  #webcam canvas { max-width: 100%; height: auto; border-radius: 12px; }
  .row { margin: 8px 0; }
  .row .head { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; }
  .bar { height: 10px; background: var(--panel); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--ok); transition: width 0.1s; }
  .row.pothole .bar > span { background: var(--danger); }
  .settings {
    margin-top: 18px;
    padding: 12px 14px;
    background: var(--panel);
    border-radius: 10px;
    font-size: 14px;
  }
  .settings label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; gap: 10px; }
  .settings input[type=range] { flex: 1; }
  .upload { margin-top: 18px; }
  .uploadBtn {
    display: block;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    border: 2px dashed var(--muted);
    cursor: pointer;
  }
  .uploadBtn:focus-within, .uploadBtn:hover { border-color: var(--accent); }
  .result { display: flex; gap: 12px; align-items: center; margin-top: 10px; padding: 10px; background: var(--panel); border-radius: 10px; }
  .result img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; flex: none; }
  .result .info { flex: 1; min-width: 0; font-size: 14px; }
  .result .fname { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .result .verdict { font-weight: 800; margin-bottom: 4px; }
  .result .verdict.bad { color: var(--danger); }
  .result .verdict.good { color: var(--ok); }
  #clearResults { margin-top: 10px; font-size: 14px; padding: 8px; display: none; width: 100%; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Pothole Detector</h1>

  <div class="buttons">
    <button id="start">Start</button>
    <button id="switch" class="secondary" style="display:none">Switch camera</button>
  </div>

  <div id="status" role="alert" aria-live="assertive"></div>
  <div id="message"></div>
  <div id="webcam"></div>
  <div id="labels"></div>

  <div class="upload">
    <label class="uploadBtn" for="imageInput">Test with photos from gallery or Drive</label>
    <input type="file" id="imageInput" accept="image/*" multiple hidden>
    <div id="results"></div>
    <button id="clearResults" class="secondary">Clear results</button>
  </div>

  <div class="settings">
    <label>Sensitivity threshold
      <input type="range" id="threshold" min="50" max="99" value="85">
      <span id="thresholdValue">0.85</span>
    </label>
    <label>Sound
      <input type="checkbox" id="optBeep" checked>
    </label>
    <label>Voice
      <input type="checkbox" id="optVoice" checked>
    </label>
    <label>Vibration (Android)
      <input type="checkbox" id="optVibrate" checked>
    </label>
    <label>Send reports to municipality
      <input type="checkbox" id="optReport">
    </label>
    <label>Use fake location (for testing)
      <input type="checkbox" id="optFake">
    </label>
    <label>Fake lat / lng
      <span>
        <input type="text" id="fakeLat" inputmode="decimal" placeholder="lat" style="width:84px">
        <input type="text" id="fakeLng" inputmode="decimal" placeholder="lng" style="width:84px">
      </span>
    </label>
    <div id="reportStatus" style="color:var(--muted);margin-top:6px;min-height:18px"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
// ===== SETTINGS =====
const MODEL_URL     = "https://teachablemachine.withgoogle.com/models/LaZgvEXcJ/";
// Any class whose name contains "poth" counts as a pothole (case-insensitive).
// Your labels: "Good Road" (not a pothole), "Pothote with Water" and "Pothole" (both potholes).
// Change this if you rename the classes.
const POTHOLE_MATCH = /poth/i;
const COOLDOWN_MS   = 3000;       // minimum gap between alerts
// ====================

function isPotholeClass(name) { return POTHOLE_MATCH.test(name); }

// ===== REPORTING (Supabase) =====
const SUPABASE_URL = "https://cjbsyqvyfqqfkbgbgfrv.supabase.co";
const SUPABASE_KEY = "sb_publishable_n-Xt6Buw9jgL-l7SqUh0ZQ_tOkrMfcQ"; // publishable key (never use the secret key)
const REPORT_THRESHOLD   = 0.90;   // confidence needed to report
const REPORT_MIN_FRAMES  = 5;      // consecutive frames above the threshold
const REPORT_COOLDOWN_MS = 10000;  // minimum gap between report attempts
const DUP_RADIUS_M       = 15;     // reports within this distance are merged
const MAX_GPS_ACCURACY_M = 30;     // ignore detections with worse GPS accuracy
// ================================

let gpsPos = null, gpsWatch = null, frameStreak = 0, lastReport = 0, savingReport = false;

function setReportStatus(text) { $("reportStatus").textContent = text; }

function startGps() {
  if (!navigator.geolocation || gpsWatch !== null) return;
  gpsWatch = navigator.geolocation.watchPosition(
    (p) => { gpsPos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; },
    (e) => setReportStatus("GPS: " + e.message),
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
}

function currentPosition() {
  if ($("optFake").checked) {
    const lat = parseFloat($("fakeLat").value), lng = parseFloat($("fakeLng").value);
    return isNaN(lat) || isNaN(lng) ? null : { lat, lng, acc: 5 };
  }
  return gpsPos;
}

function distanceM(lat1, lng1, lat2, lng2) { // haversine, in meters
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function snapshot() { // small JPEG (320 px wide) of the current camera frame
  const src = webcam.canvas;
  const w = 320, h = Math.round(src.height * w / src.width);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(src, 0, 0, w, h);
  return c.toDataURL("image/jpeg", 0.6);
}

async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...options,
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (!res.ok) throw new Error("database error " + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function saveReport(score) {
  if (savingReport) return;
  if (SUPABASE_URL.startsWith("PASTE")) { setReportStatus("Add your Supabase URL and key in index.html"); return; }
  const pos = currentPosition();
  if (!pos) { setReportStatus("Waiting for a GPS location…"); return; }
  if (pos.acc > MAX_GPS_ACCURACY_M) {
    setReportStatus("GPS too inaccurate (" + Math.round(pos.acc) + " m), skipped");
    return;
  }
  savingReport = true;
  try {
    const open = await api("reports?select=id,lat,lng,detections&status=eq.reported");
    const dup = (open || []).find((r) => distanceM(r.lat, r.lng, pos.lat, pos.lng) <= DUP_RADIUS_M);
    if (dup) {
      await api("reports?id=eq." + dup.id, {
        method: "PATCH",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify({ detections: dup.detections + 1 }),
      });
      setReportStatus("Already reported nearby, seen " + (dup.detections + 1) + " times");
    } else {
      await api("reports", {
        method: "POST",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify({
          lat: pos.lat, lng: pos.lng, accuracy: pos.acc,
          confidence: score, image: snapshot(),
        }),
      });
      setReportStatus("Report sent ✔ " + new Date().toLocaleTimeString());
    }
  } catch (e) {
    setReportStatus("Could not save: " + e.message);
  }
  lastReport = Date.now();
  savingReport = false;
}

function trackForReport(score) {
  frameStreak = score >= REPORT_THRESHOLD ? frameStreak + 1 : 0;
  if (!$("optReport").checked) return;
  if (frameStreak >= REPORT_MIN_FRAMES && Date.now() - lastReport >= REPORT_COOLDOWN_MS) {
    frameStreak = 0;
    saveReport(score);
  }
}

let model, webcam, labelDiv, maxClasses, audioCtx;
let lastAlert = 0, running = false, facing = "environment";

const $ = (id) => document.getElementById(id);

$("threshold").oninput = () => {
  $("thresholdValue").textContent = (Number($("threshold").value) / 100).toFixed(2);
};

function beep() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = 880;
  gain.gain.value = 0.3;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

function alertPothole() {
  const now = Date.now();
  if (now - lastAlert < COOLDOWN_MS) return;
  lastAlert = now;

  if ($("optBeep").checked) beep();
  if ($("optVoice").checked) {
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance("Pothole ahead"));
  }
  if ($("optVibrate").checked && navigator.vibrate) navigator.vibrate([300, 100, 300]);

  $("status").textContent = "⚠️ POTHOLE AHEAD";
  document.body.classList.add("alert");
  setTimeout(() => {
    $("status").textContent = "";
    document.body.classList.remove("alert");
  }, 1500);
}

async function startCamera() {
  if (webcam) {
    running = false;
    await webcam.stop();
    $("webcam").innerHTML = "";
  }
  // Mirror the image only for the front camera
  webcam = new tmImage.Webcam(300, 300, facing === "user");
  await webcam.setup({ facingMode: facing });
  await webcam.play();
  $("webcam").appendChild(webcam.canvas);
  running = true;
  window.requestAnimationFrame(loop);
}

async function loop() {
  if (!running) return;
  webcam.update();
  const prediction = await model.predict(webcam.canvas);
  const threshold = Number($("threshold").value) / 100;
  let potholeScore = 0; // combined score of all pothole classes

  for (let i = 0; i < maxClasses; i++) {
    const p = prediction[i];
    const row = labelDiv.children[i];
    row.querySelector(".name").textContent = p.className;
    row.querySelector(".pct").textContent = p.probability.toFixed(2);
    row.querySelector(".bar > span").style.width = (p.probability * 100) + "%";
    if (isPotholeClass(p.className)) potholeScore += p.probability;
  }
  if (potholeScore >= threshold) alertPothole();
  trackForReport(potholeScore);
  window.requestAnimationFrame(loop);
}

$("start").onclick = async () => {
  try {
    $("message").textContent = "Loading model…";
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();                                  // unlock sound
    speechSynthesis.speak(new SpeechSynthesisUtterance(""));  // unlock voice (iOS)

    await ensureModel();

    labelDiv = $("labels");
    labelDiv.innerHTML = "";
    const names = model.getClassLabels();
    for (let i = 0; i < maxClasses; i++) {
      const row = document.createElement("div");
      row.className = "row" + (isPotholeClass(names[i]) ? " pothole" : "");
      row.innerHTML =
        '<div class="head"><span class="name"></span><span class="pct"></span></div>' +
        '<div class="bar"><span></span></div>';
      labelDiv.appendChild(row);
    }

    $("message").textContent = "Starting camera…";
    await startCamera();
    startGps();
    $("message").textContent = "Running. Keep this tab open and the screen on.";
    $("start").style.display = "none";
    $("switch").style.display = "block";
  } catch (err) {
    $("message").textContent = "Error: " + err.message +
      ". Check camera permission and that the page is opened over HTTPS.";
  }
};

// ----- Test with photos from gallery / Drive -----
async function ensureModel() {
  if (!model) {
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    maxClasses = model.getTotalClasses();
  }
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
    } catch (e) { /* sound stays off if the browser blocks it */ }
  }
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Could not read " + file.name));
    img.src = URL.createObjectURL(file);
  });
}

function addResult(img, fileName, prediction, threshold) {
  const best = prediction.reduce((a, b) => (b.probability > a.probability ? b : a));
  const potholeScore = prediction
    .filter((p) => isPotholeClass(p.className))
    .reduce((sum, p) => sum + p.probability, 0);
  const isPothole = potholeScore >= threshold;

  const card = document.createElement("div");
  card.className = "result";

  const thumb = document.createElement("img");
  thumb.src = img.src;
  thumb.alt = fileName;

  const info = document.createElement("div");
  info.className = "info";

  const fname = document.createElement("div");
  fname.className = "fname";
  fname.textContent = fileName;

  const verdict = document.createElement("div");
  verdict.className = "verdict " + (isPothole ? "bad" : "good");
  verdict.textContent = isPothole
    ? "⚠️ Pothole detected (" + potholeScore.toFixed(2) + ")"
    : "No pothole (best match: " + best.className + ")";

  info.appendChild(fname);
  info.appendChild(verdict);
  prediction.forEach((p) => {
    const line = document.createElement("div");
    line.textContent = p.className + ": " + p.probability.toFixed(2);
    info.appendChild(line);
  });

  card.appendChild(thumb);
  card.appendChild(info);
  $("results").prepend(card);
  $("clearResults").style.display = "block";

  if (isPothole) {
    lastAlert = 0; // let each uploaded photo trigger its own alert
    alertPothole();
  }
}

$("imageInput").onchange = async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  try {
    $("message").textContent = "Loading model…";
    await ensureModel();
    const threshold = Number($("threshold").value) / 100;
    for (const file of files) {
      $("message").textContent = "Checking " + file.name + "…";
      const img = await loadImage(file);
      const prediction = await model.predict(img);
      addResult(img, file.name, prediction, threshold);
    }
    $("message").textContent = "";
  } catch (err) {
    $("message").textContent = "Error: " + err.message;
  }
  e.target.value = ""; // allow picking the same photo again
};

$("clearResults").onclick = () => {
  $("results").innerHTML = "";
  $("clearResults").style.display = "none";
};

$("switch").onclick = async () => {
  try {
    facing = facing === "environment" ? "user" : "environment";
    await startCamera();
  } catch (err) {
    $("message").textContent = "Could not switch camera: " + err.message;
  }
};
</script>
</body>
</html>
